<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4CAF50">
<title>功課背誦登記</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg-primary: #f5f7fa;
  --bg-secondary: #ffffff;
  --bg-card: #ffffff;
  --bg-hover: #f0f0f0;
  --text-primary: #1a1a1a;
  --text-secondary: #666666;
  --text-muted: #999999;
  --border-color: #e0e0e0;
  --accent: #4CAF50;
  --accent-hover: #45a049;
  --accent-light: #e8f5e9;
  --danger: #f44336;
  --danger-light: #ffebee;
  --warning: #ff9800;
  --warning-light: #fff3e0;
  --info: #2196F3;
  --info-light: #e3f2fd;
  --check-done: #4CAF50;
  --check-done-text: #fff;
  --check-empty: #fff;
  --check-border: #d0d0d0;
  --shadow: 0 2px 4px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.12);
  --header-height: 56px;
  --tabbar-height: 64px;
  --col-w: 40px;
  --name-w: 90px;
}
[data-theme="dark"] {
  --bg-primary: #121212;
  --bg-secondary: #1e1e1e;
  --bg-card: #242424;
  --bg-hover: #2d2d2d;
  --text-primary: #e8e8e8;
  --text-secondary: #b0b0b0;
  --text-muted: #707070;
  --border-color: #3a3a3a;
  --accent: #66BB6A;
  --accent-hover: #81C784;
  --accent-light: #1b3a1d;
  --danger: #ef5350;
  --danger-light: #3a1a1a;
  --warning: #ffa726;
  --warning-light: #3a2a1a;
  --info: #42A5F5;
  --info-light: #1a2a3a;
  --check-done: #66BB6A;
  --check-done-text: #fff;
  --check-empty: #2a2a2a;
  --check-border: #505050;
  --shadow: 0 2px 4px rgba(0,0,0,0.3);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;background:var(--bg-primary);color:var(--text-primary);font-size:16px;line-height:1.5;overscroll-behavior:none;transition:background .2s,color .2s}
body{padding-top:var(--header-height);padding-bottom:var(--tabbar-height);min-height:100vh}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text-primary);background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;padding:10px 12px;outline:none;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px;line-height:1.6}
.app-header{position:fixed;top:0;left:0;right:0;height:var(--header-height);background:var(--bg-secondary);border-bottom:1px solid var(--border-color);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:100;box-shadow:var(--shadow)}
.app-title{font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap;flex-shrink:0}
.class-selector{flex:1;min-width:0;padding:8px 10px;font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:background .2s}
.icon-btn:hover,.icon-btn:active{background:var(--bg-hover)}
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:var(--tabbar-height);background:var(--bg-secondary);border-top:1px solid var(--border-color);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 4px rgba(0,0,0,.05)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text-muted);padding:6px 4px;transition:color .15s}
.tab-btn .tab-icon{font-size:22px;line-height:1}
.tab-btn.active{color:var(--accent);font-weight:600}
.tab-section{display:none;padding:12px;max-width:900px;margin:0 auto}
.tab-section.active{display:block}
.section-title{font-size:18px;font-weight:700;margin:0 0 12px;color:var(--text-primary)}
.card{background:var(--bg-card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border-color)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer;user-select:none;-webkit-user-select:none}
.card-title{font-size:15px;font-weight:600;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;background:var(--bg-hover);color:var(--text-primary);border:1px solid var(--border-color);transition:all .15s;min-height:40px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-outline{background:transparent}
.btn-sm{padding:6px 10px;font-size:13px;min-height:32px}
.btn-block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.form-row>*{flex:1;min-width:0}
.form-row>.btn{flex:0 0 auto}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.form-group{margin-bottom:12px}
.form-hint{font-size:12px;color:var(--text-muted);margin-top:4px}
.list-item{display:flex;align-items:center;padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;margin-bottom:6px;gap:8px}
.list-item-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item-meta{font-size:12px;color:var(--text-muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--info-light);color:var(--info)}
.badge-recitation{background:var(--warning-light);color:var(--warning)}
.inline-input{background:var(--bg-secondary);border:1px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:14px;outline:none;width:100%;color:var(--text-primary)}
/* collapsible book section */
.book-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.book-section-header{display:flex;align-items:center;padding:12px 14px;gap:8px;cursor:pointer;user-select:none;-webkit-user-select:none;flex-wrap:wrap}
.book-section-header:active{background:var(--bg-hover)}
.book-section-title{flex:1;font-size:14px;font-weight:600;min-width:0}
.book-section-meta{font-size:11px;color:var(--text-muted)}
.book-section-arrow{font-size:12px;color:var(--text-muted);transition:transform .2s;flex-shrink:0}
.book-section.collapsed .book-section-arrow{transform:rotate(-90deg)}
.book-section.collapsed .book-section-body{display:none}
.book-section-body{padding:0 14px 14px}
.cur-lesson-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px 10px;background:var(--bg-hover);border-radius:8px;flex-wrap:wrap}
.cur-lesson-bar span{font-size:13px}
.cur-lesson-bar .cur-val{font-weight:700;font-size:15px;min-width:30px;text-align:center}
/* grid */
.grid-wrapper{overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.check-grid{display:grid;font-size:13px;width:max-content;min-width:100%}
.grid-cell{border-bottom:1px solid var(--border-color);border-right:1px solid var(--border-color);display:flex;align-items:center;justify-content:center;padding:4px;min-width:40px;min-height:40px;background:var(--bg-card)}
.grid-header{background:var(--bg-hover);font-weight:600;position:sticky;top:0;z-index:2;font-size:12px;flex-direction:column;gap:2px}
.grid-header .mark-all-btn{font-size:9px;padding:1px 4px;border-radius:3px;background:var(--accent);color:#fff;cursor:pointer}
.grid-header.review-col{background:var(--warning-light)}
.grid-name-cell{position:sticky;left:0;z-index:4;background:var(--bg-card);font-weight:500;justify-content:flex-start;padding-left:10px;min-width:var(--name-w);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;box-shadow:1px 0 0 var(--border-color)}
.grid-corner{position:sticky;left:0;top:0;z-index:5;background:var(--bg-hover);font-weight:700;min-width:var(--name-w);justify-content:flex-start;padding-left:10px;box-shadow:1px 0 0 var(--border-color)}
.check-cell{cursor:pointer;user-select:none;-webkit-user-select:none}
.check-mark{width:26px;height:26px;border-radius:6px;border:2px solid var(--check-border);background:var(--check-empty);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:transparent;transition:all .1s}
.check-cell.done .check-mark{background:var(--check-done);border-color:var(--check-done);color:var(--check-done-text)}
.check-cell.partial .check-mark{background:var(--warning);border-color:var(--warning);color:#fff}
.check-cell:active .check-mark{transform:scale(.9)}
.summary-table{width:100%;border-collapse:collapse;font-size:13px}
.summary-table th,.summary-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border-color)}
.summary-table th{background:var(--bg-hover);font-weight:600;font-size:12px;color:var(--text-secondary)}
.summary-table td.col-count{width:60px;text-align:center;font-weight:700}
.severity-low{color:var(--accent)}
.severity-mid{color:var(--warning)}
.severity-high{color:var(--danger)}
.summary-empty{text-align:center;padding:20px;color:var(--text-muted);font-size:14px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:48px;margin-bottom:8px;opacity:.5}
.empty-state-text{font-size:14px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-backdrop.active{display:flex}
.modal{background:var(--bg-card);border-radius:12px;padding:20px;max-width:400px;width:100%;box-shadow:var(--shadow-lg)}
.modal-title{font-size:16px;font-weight:700;margin:0 0 8px}
.modal-text{font-size:14px;color:var(--text-secondary);margin:0 0 16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:calc(var(--tabbar-height) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-primary);color:var(--bg-primary);padding:10px 20px;border-radius:24px;font-size:14px;font-weight:500;opacity:0;transition:all .2s;z-index:300;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pdf-render-area{position:absolute;left:-10000px;top:0;width:1122px;background:#fff;color:#000;padding:30px;font-family:"PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif}
.pdf-render-area h1{font-size:22px;margin:0 0 4px;text-align:center;color:#000}
.pdf-render-area .pdf-meta{text-align:center;font-size:12px;color:#555;margin-bottom:16px}
.pdf-render-area h2{font-size:16px;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid #333;color:#000}
.pdf-render-area table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px;page-break-inside:avoid}
.pdf-render-area table th,.pdf-render-area table td{border:1px solid #888;padding:4px 6px;text-align:center;color:#000}
.pdf-render-area table th{background:#e8e8e8;font-weight:700}
.pdf-render-area table td.name{text-align:left;white-space:nowrap}
.pdf-render-area .pdf-check{color:#2e7d32;font-weight:700}
.pdf-render-area .pdf-miss{color:#c62828}
.pdf-render-area .pdf-partial{color:#e65100;font-weight:700}
/* expandable edit panel */
.edit-panel{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:8px;padding:12px;margin-top:8px}
.edit-panel .form-row{margin-bottom:8px}
/* today page */
.today-date{font-size:13px;color:var(--text-secondary);margin:-6px 0 12px;font-weight:600}
.today-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.today-book{font-size:15px;font-weight:700;flex:1;min-width:0}
.today-count{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.today-sel-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.today-sel-row .form-label{margin:0;white-space:nowrap}
.today-legend{font-size:11px;color:var(--text-muted);margin-bottom:8px}
.today-chips{display:flex;flex-wrap:wrap;gap:8px}
.stu-chip{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border-radius:20px;border:2px solid var(--check-border);background:var(--bg-secondary);color:var(--text-primary);font-size:14px;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none;min-height:44px;transition:background .12s,border-color .12s,color .12s}
.stu-chip:active{transform:scale(.95)}
.stu-chip.done{background:var(--check-done);border-color:var(--check-done);color:var(--check-done-text)}
.stu-chip.partial{background:var(--warning);border-color:var(--warning);color:#fff}
.stu-chip .chip-mark{font-size:14px;font-weight:700;min-width:12px}
.today-result{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px}
.today-result.miss{background:var(--danger-light);border:1px solid var(--danger)}
.today-result.ok{background:var(--accent-light);border:1px solid var(--accent)}
.today-result-title{font-weight:700;margin-bottom:4px}
.today-result.miss .today-result-title{color:var(--danger)}
.today-result.ok .today-result-title{color:var(--accent)}
.today-miss-names{line-height:1.8}
@media(max-width:480px){
  :root{--col-w:36px;--name-w:80px}
  .app-title{font-size:15px}
  .grid-cell{min-width:36px;min-height:36px}
  .check-mark{width:22px;height:22px;font-size:14px}
  .grid-name-cell,.grid-corner{font-size:12px}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="app-title">📚 功課登記</div>
  <select id="classSelector" class="class-selector"></select>
  <button id="darkModeBtn" class="icon-btn" title="切換深色模式">🌙</button>
</header>
<main>
  <section id="tab-today" class="tab-section active">
    <h2 class="section-title">今日應繳作業</h2>
    <div class="today-date" id="todayDate"></div>
    <div id="todayArea"></div>
  </section>
  <section id="tab-checkin" class="tab-section">
    <h2 class="section-title">登記進度</h2>
    <div id="checkinArea"></div>
  </section>
  <section id="tab-summary" class="tab-section">
    <h2 class="section-title">未完成總覽</h2>
    <div class="card" style="padding:10px"><label style="font-size:13px;color:var(--text-secondary)"><input type="checkbox" id="showAllStudents" style="width:auto;margin-right:4px"> 顯示全部學生</label></div>
    <div id="summaryArea"></div>
  </section>
  <section id="tab-settings" class="tab-section">
    <h2 class="section-title">設定</h2>
    <div class="card">
      <div class="card-header"><h3 class="card-title">🏫 班級管理</h3></div>
      <div class="form-row"><input type="text" id="newClassName" placeholder="班級名稱（例：三年甲班）"><button class="btn btn-primary" id="addClassBtn">新增</button></div>
      <div id="classList"></div>
    </div>
    <div class="card">
      <div class="card-header"><h3 class="card-title">👥 學生名單</h3><span id="currentClassLabel" class="list-item-meta"></span></div>
      <div class="form-group">
        <label class="form-label">批次新增（每行格式：英文名 中文名）</label>
        <textarea id="bulkStudentInput" placeholder="Amy 王小明&#10;Bob 李小華&#10;Cindy 張小美"></textarea>
        <div class="form-hint">以空白分隔英文名與中文名。已存在的中文名會跳過。</div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="addStudentsBtn">新增學生</button><button class="btn btn-outline" id="clearStudentsBtn">清空名單</button></div>
      <div id="studentList" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <div class="card-header"><h3 class="card-title">📚 作業簿本與背誦教材</h3></div>
      <div class="form-row">
        <select id="newBookType" style="max-width:120px"><option value="homework">📖 功課</option><option value="recitation">🎤 背誦</option></select>
        <input type="text" id="newBookName" placeholder="名稱">
      </div>
      <div class="form-row">
        <div><label class="form-label">課數標籤</label><select id="newBookLabel"><option value="#">#（純數字）</option><option value="lesson">Lesson</option><option value="unit">Unit</option></select></div>
        <div><label class="form-label">起始課數</label><input type="number" id="newBookStart" value="1" min="1" max="999"></div>
        <div><label class="form-label">總課數</label><input type="number" id="newBookLessons" min="1" max="999" placeholder="必填"></div>
      </div>
      <div class="form-row">
        <div><label class="form-label">目前最新課數</label><input type="number" id="newBookCurrentLesson" placeholder="留空=全部" min="1" max="999"></div>
        <div><label class="form-label">單/雙課</label><select id="newBookLessonFilter"><option value="all">全部</option><option value="odd">只需單課</option><option value="even">只需雙課</option></select></div>
        <div><label class="form-label">跳過每第N課</label><input type="number" id="newBookSkipEvery" placeholder="不跳" min="2" max="999"></div>
      </div>
      <button class="btn btn-primary btn-block" id="addBookBtn">新增項目</button>
      <div id="bookList" style="margin-top:12px"></div>
    </div>
  </section>
  <section id="tab-export" class="tab-section">
    <h2 class="section-title">匯出</h2>
    <div class="card">
      <div class="card-header"><h3 class="card-title">📄 匯出 PDF（A4 橫式）</h3></div>
      <p class="form-hint" style="margin-bottom:10px">勾選要匯出的教材，產生 A4 橫式 PDF。</p>
      <div id="pdfBookSelector" style="margin-bottom:10px"></div>
      <div class="btn-row" style="margin-bottom:8px"><button class="btn btn-sm btn-outline" id="pdfSelectAll">全選</button><button class="btn btn-sm btn-outline" id="pdfSelectNone">全不選</button></div>
      <button class="btn btn-primary btn-block" id="exportPdfBtn">產生 PDF</button>
    </div>
    <div class="card">
      <div class="card-header"><h3 class="card-title">💾 JSON 備份/還原</h3></div>
      <p class="form-hint" style="margin-bottom:10px">匯出全部資料為 JSON 檔可備份或在其他裝置還原。</p>
      <div class="btn-row"><button class="btn btn-primary" id="exportJsonBtn">📤 匯出 JSON</button><button class="btn btn-outline" id="importJsonBtn">📥 匯入 JSON</button><input type="file" id="importJsonFile" accept=".json" style="display:none"></div>
    </div>
    <div class="card">
      <div class="card-header"><h3 class="card-title" style="color:var(--danger)">⚠️ 危險區域</h3></div>
      <button class="btn btn-danger btn-block" id="resetAllBtn">清除所有資料</button>
    </div>
  </section>
</main>
<nav class="tab-bar">
  <div class="tab-btn active" data-tab="today"><div class="tab-icon">📅</div><div>今日</div></div>
  <div class="tab-btn" data-tab="checkin"><div class="tab-icon">✅</div><div>登記</div></div>
  <div class="tab-btn" data-tab="summary"><div class="tab-icon">📊</div><div>總覽</div></div>
  <div class="tab-btn" data-tab="settings"><div class="tab-icon">⚙️</div><div>設定</div></div>
  <div class="tab-btn" data-tab="export"><div class="tab-icon">📤</div><div>匯出</div></div>
</nav>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal"><h3 class="modal-title" id="modalTitle">確認</h3><p class="modal-text" id="modalText"></p><div class="modal-actions"><button class="btn btn-outline" id="modalCancel">取消</button><button class="btn btn-danger" id="modalConfirm">確定</button></div></div></div>
<div id="toast" class="toast"></div>
<div id="pdfRenderArea" class="pdf-render-area"></div>
<script>
'use strict';
const STORAGE_KEY = 'hwReciteApp_v1';
const defaultState = () => ({version:1,darkMode:false,activeClassId:null,classes:[],books:[],records:{},collapsed:{},todayLesson:{}});
let state = loadState();
function loadState(){try{const r=localStorage.getItem(STORAGE_KEY);if(!r)return defaultState();return Object.assign(defaultState(),JSON.parse(r))}catch(e){return defaultState()}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){showToast('儲存失敗')}}
function uid(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function el(tag,attrs={},...ch){const n=document.createElement(tag);for(const k in attrs){if(k==='class')n.className=attrs[k];else if(k==='style')n.style.cssText=attrs[k];else if(k.startsWith('on')&&typeof attrs[k]==='function')n.addEventListener(k.slice(2).toLowerCase(),attrs[k]);else if(k==='dataset')Object.assign(n.dataset,attrs[k]);else n.setAttribute(k,attrs[k])}for(const c of ch){if(c==null||c===false)continue;n.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(c):c)}return n}
let toastTimer;
function showToast(m,d=2000){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),d)}
function confirmDialog(title,text){return new Promise(r=>{$('#modalTitle').textContent=title;$('#modalText').textContent=text;const b=$('#modalBackdrop');b.classList.add('active');const done=v=>{b.classList.remove('active');$('#modalConfirm').onclick=null;$('#modalCancel').onclick=null;b.onclick=null;r(v)};$('#modalConfirm').onclick=()=>done(true);$('#modalCancel').onclick=()=>done(false);b.onclick=e=>{if(e.target===b)done(false)}})}
function getActiveClass(){return state.classes.find(c=>c.id===state.activeClassId)||null}
function getBooksForActiveClass(type){return state.books.filter(b=>b.classId===state.activeClassId&&(!type||b.type===type))}
function recordKey(bid,l,sid){return bid+':'+l+':'+sid}
function getStatus(bid,l,sid){const v=state.records[recordKey(bid,l,sid)];if(v===true)return 'done';if(v==='partial')return 'partial';return 'empty'}
function setStatus(bid,l,sid,st){const k=recordKey(bid,l,sid);if(st==='done')state.records[k]=true;else if(st==='partial')state.records[k]='partial';else delete state.records[k]}
function isDone(bid,l,sid){return state.records[recordKey(bid,l,sid)]===true}
function setDone(bid,l,sid,d){setStatus(bid,l,sid,d?'done':'empty')}
function cycleStatus(bid,l,sid,isHomework){const cur=getStatus(bid,l,sid);if(isHomework){if(cur==='empty')return 'partial';if(cur==='partial')return 'done';return 'empty'}return cur==='done'?'empty':'done'}
function ensureBookDefaults(b){if(b.startLesson===undefined)b.startLesson=1;if(!b.lessonLabel)b.lessonLabel='#';if(b.currentLesson===undefined)b.currentLesson=0;if(!b.lessonFilter)b.lessonFilter='all';if(b.skipEvery===undefined)b.skipEvery=0;if(!b.reviews)b.reviews=[];if(b.reviewStart===undefined)b.reviewStart=1}
function getRequiredLessons(b){ensureBookDefaults(b);const start=b.startLesson||1;const end=b.currentLesson>0?Math.min(b.currentLesson,b.totalLessons):b.totalLessons;const lessons=[];for(let n=start;n<=end;n++){if(b.lessonFilter==='odd'&&n%2===0)continue;if(b.lessonFilter==='even'&&n%2===1)continue;if(b.skipEvery>0&&n%b.skipEvery===0)continue;lessons.push(n)}return lessons}
function getFullColumns(b){ensureBookDefaults(b);const lessons=getRequiredLessons(b);const revSet=new Set(b.reviews.map(r=>r.after));const cols=[];let ri=b.reviewStart||1;lessons.forEach(n=>{cols.push({key:String(n),num:n,type:'lesson'});if(revSet.has(n)){cols.push({key:'r'+n,num:n,type:'review',label:'R'+ri});ri++}});return cols}
function fmtLesson(b,n){ensureBookDefaults(b);if(b.lessonLabel==='lesson')return 'L'+n;if(b.lessonLabel==='unit')return 'U'+n;return String(n)}
function fmtLessonFull(b,n){ensureBookDefaults(b);if(b.lessonLabel==='lesson')return 'Lesson '+n;if(b.lessonLabel==='unit')return 'Unit '+n;return String(n)}
function bookInfoText(b){ensureBookDefaults(b);const parts=[];const cols=getFullColumns(b);parts.push(cols.length+'/'+b.totalLessons+'欄');if(b.currentLesson>0&&b.currentLesson<b.totalLessons)parts.push('進度至'+b.currentLesson);if(b.lessonFilter==='odd')parts.push('單課');if(b.lessonFilter==='even')parts.push('雙課');if(b.skipEvery>0)parts.push('跳每'+b.skipEvery+'課');if(b.startLesson>1)parts.push('從'+b.startLesson+'起');if(b.reviews.length)parts.push(b.reviews.length+'個複習');return parts.join(' · ')}

function buildGridNames(students){const counts={};students.forEach(s=>{const eng=(s.engName||'').toLowerCase();if(eng)counts[eng]=(counts[eng]||0)+1});return students.map(s=>{if(!s.engName)return s.name;const eng=s.engName;if(counts[eng.toLowerCase()]>1&&s.name){return eng+'('+s.name.charAt(0)+')'}return eng})}

// ============ Today ============
function colLabelFull(b,col){return col.type==='review'?('複習 '+col.label):fmtLessonFull(b,col.num)}
function chipClass(st){return 'stu-chip'+(st==='done'?' done':st==='partial'?' partial':'')}
function chipMark(st){return st==='done'?'✓':st==='partial'?'△':''}

function renderToday(){
const area=$('#todayArea');area.innerHTML='';
$('#todayDate').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
const cls=getActiveClass();
if(!cls){area.appendChild(emptyState('🏫','請至「設定」新增班級'));return}
if(!cls.students.length){area.appendChild(emptyState('👥','請至「設定」新增學生'));return}
const books=getBooksForActiveClass('homework');
if(!books.length){area.appendChild(emptyState('📖','請至「設定」新增功課教材'));return}
const gridNames=buildGridNames(cls.students);
const nameOf={};cls.students.forEach((s,i)=>{nameOf[s.id]=gridNames[i]});

books.forEach(b=>{
ensureBookDefaults(b);
const cols=getFullColumns(b);
const card=el('div',{class:'card'});
const countEl=el('span',{class:'today-count'});
card.appendChild(el('div',{class:'today-head'},el('span',{class:'today-book'},b.name),countEl));
if(!cols.length){card.appendChild(el('div',{class:'summary-empty'},'目前無應繳課次'));area.appendChild(card);return}

let selKey=state.todayLesson[b.id];
if(!cols.some(c=>c.key===selKey))selKey=cols[cols.length-1].key;

const sel=el('select',{onchange:e=>{state.todayLesson[b.id]=e.target.value;saveState();renderToday()}});
cols.forEach(c=>{const o=el('option',{value:c.key},colLabelFull(b,c));if(c.key===selKey)o.selected=true;sel.appendChild(o)});
card.appendChild(el('div',{class:'today-sel-row'},el('span',{class:'form-label'},'應繳課次'),sel));
card.appendChild(el('div',{class:'today-legend'},'點一下＝已繳交 ✓，再點一下＝已交未訂正 △，第三下＝取消'));

const resultBox=el('div');
const chipRefs=[];

function refresh(){
  const missing=cls.students.filter(s=>getStatus(b.id,selKey,s.id)==='empty');
  const partial=cls.students.filter(s=>getStatus(b.id,selKey,s.id)==='partial');
  countEl.textContent='已繳 '+(cls.students.length-missing.length)+' / '+cls.students.length;
  resultBox.innerHTML='';
  if(!missing.length){
    resultBox.className='today-result ok';
    resultBox.appendChild(el('div',{class:'today-result-title'},'✅ 全班都繳交了！'));
  }else{
    resultBox.className='today-result miss';
    resultBox.appendChild(el('div',{class:'today-result-title'},'⚠️ 未繳交（'+missing.length+' 人）'));
    resultBox.appendChild(el('div',{class:'today-miss-names'},missing.map(s=>nameOf[s.id]).join('、')));
  }
  if(partial.length){
    resultBox.appendChild(el('div',{style:'margin-top:6px;padding-top:6px;border-top:1px dashed var(--border-color);color:var(--warning);font-size:12px'},'△ 已交未訂正（'+partial.length+' 人）：'+partial.map(s=>nameOf[s.id]).join('、')));
  }
}

const chips=el('div',{class:'today-chips'});
cls.students.forEach(s=>{
  const st=getStatus(b.id,selKey,s.id);
  const mark=el('span',{class:'chip-mark'},chipMark(st));
  const chip=el('div',{class:chipClass(st),onclick:()=>{
    const cur=getStatus(b.id,selKey,s.id);
    const next=cur==='empty'?'done':cur==='done'?'partial':'empty';
    setStatus(b.id,selKey,s.id,next);
    saveState();
    chip.className=chipClass(next);
    mark.textContent=chipMark(next);
    refresh();
  }},mark,el('span',{},nameOf[s.id]));
  chipRefs.push({s,chip,mark});
  chips.appendChild(chip);
});
card.appendChild(chips);

const setAll=st=>{cls.students.forEach(s=>setStatus(b.id,selKey,s.id,st));saveState();chipRefs.forEach(r=>{r.chip.className=chipClass(st);r.mark.textContent=chipMark(st)});refresh()};
card.appendChild(el('div',{class:'btn-row',style:'margin-top:10px'},
  el('button',{class:'btn btn-sm btn-primary',onclick:()=>setAll('done')},'全部已繳'),
  el('button',{class:'btn btn-sm btn-outline',onclick:()=>setAll('empty')},'全部清除')));

card.appendChild(resultBox);
refresh();
area.appendChild(card);
});
}

if(!cls){area.appendChild(emptyState('🏫','請至「設定」新增班級'));return}

const books=getBooksForActiveClass();
if(!books.length){area.appendChild(emptyState('📚','請至「設定」新增教材'));return}
books.forEach(b=>{ensureBookDefaults(b);const cols=getFullColumns(b);const isCollapsed=!!state.collapsed[b.id];
const section=el('div',{class:'book-section'+(isCollapsed?' collapsed':'')});
const typeBadge=el('span',{class:'badge '+(b.type==='recitation'?'badge-recitation':''),style:'flex-shrink:0'},b.type==='recitation'?'背誦':'功課');
const arrow=el('span',{class:'book-section-arrow'},'▼');
const header=el('div',{class:'book-section-header',onclick:()=>{section.classList.toggle('collapsed');state.collapsed[b.id]=section.classList.contains('collapsed');saveState()}},typeBadge,el('span',{class:'book-section-title'},b.name),el('span',{class:'book-section-meta'},bookInfoText(b)),arrow);
section.appendChild(header);
const body=el('div',{class:'book-section-body'});
const curBar=el('div',{class:'cur-lesson-bar'});
curBar.appendChild(el('span',{style:'font-weight:600;color:var(--text-secondary)'},'最新課數'));
const curVal=el('span',{class:'cur-val'},String(b.currentLesson>0?b.currentLesson:b.totalLessons));
const applyProgress=target=>{if(b.type==='homework'){getBooksForActiveClass('homework').forEach(hb=>{if(target>=hb.totalLessons)hb.currentLesson=0;else if(target<1)hb.currentLesson=1;else hb.currentLesson=target})}else{if(target>=b.totalLessons)b.currentLesson=0;else if(target<1)b.currentLesson=1;else b.currentLesson=target}};
curBar.appendChild(el('button',{class:'btn btn-sm btn-outline',onclick:e=>{e.stopPropagation();const cur=b.currentLesson>0?b.currentLesson:b.totalLessons;if(cur<=b.startLesson)return;applyProgress(cur-1);saveState();renderCheckin()}},'−'));
curBar.appendChild(curVal);
curBar.appendChild(el('button',{class:'btn btn-sm btn-outline',onclick:e=>{e.stopPropagation();const cur=b.currentLesson>0?b.currentLesson:b.totalLessons;applyProgress(cur+1);saveState();renderCheckin()}},'＋'));
curBar.appendChild(el('span',{style:'color:var(--text-muted)'},'/ '+b.totalLessons+(b.currentLesson>0?'':'（全部）')));
if(b.type==='homework')curBar.appendChild(el('span',{style:'color:var(--text-muted);font-size:11px;margin-left:auto'},'（同步所有功課）'));
body.appendChild(curBar);
if(!cols.length){body.appendChild(el('div',{class:'empty-state-text',style:'padding:16px;text-align:center'},'目前無需完成的課數'));section.appendChild(body);area.appendChild(section);return}
const wrapper=el('div',{class:'grid-wrapper'});const grid=el('div',{class:'check-grid'});
grid.style.gridTemplateColumns='minmax(var(--name-w),1fr) repeat('+cols.length+',var(--col-w))';
grid.appendChild(el('div',{class:'grid-cell grid-corner'},'姓名'));
const isHwBook=b.type==='homework';
cols.forEach(col=>{const markAll=el('span',{class:'mark-all-btn',onclick:e=>{e.stopPropagation();const sts=cls.students.map(s=>getStatus(b.id,col.key,s.id));const allEmpty=sts.every(x=>x==='empty');const allPartial=sts.every(x=>x==='partial');const allDone=sts.every(x=>x==='done');let next;if(isHwBook){if(allEmpty)next='partial';else if(allPartial)next='done';else if(allDone)next='empty';else next='done'}else{next=allDone?'empty':'done'}cls.students.forEach(s=>setStatus(b.id,col.key,s.id,next));saveState();renderCheckin()}},'全');
const colLabel=col.type==='review'?col.label:fmtLesson(b,col.num);
grid.appendChild(el('div',{class:'grid-cell grid-header'+(col.type==='review'?' review-col':'')},el('span',{style:'font-weight:700'},colLabel),markAll))});
const gridNames=buildGridNames(cls.students);
cls.students.forEach((s,i)=>{grid.appendChild(el('div',{class:'grid-cell grid-name-cell'},gridNames[i]));
cols.forEach(col=>{const st=getStatus(b.id,col.key,s.id);const mark=el('div',{class:'check-mark'},st==='done'?'✓':st==='partial'?'△':'');const cell=el('div',{class:'grid-cell check-cell'+(st==='done'?' done':st==='partial'?' partial':''),onclick:()=>{const ns=cycleStatus(b.id,col.key,s.id,isHwBook);setStatus(b.id,col.key,s.id,ns);cell.className='grid-cell check-cell'+(ns==='done'?' done':ns==='partial'?' partial':'');mark.textContent=ns==='done'?'✓':ns==='partial'?'△':'';saveState()}},mark);grid.appendChild(cell)})});
wrapper.appendChild(grid);body.appendChild(wrapper);
const total=cls.students.length*cols.length;const done=cls.students.reduce((sum,s)=>sum+cols.filter(c=>getStatus(b.id,c.key,s.id)==='done').length,0);const pct=total>0?Math.round(done/total*100):0;
body.appendChild(el('div',{style:'margin-top:8px;text-align:center;font-size:12px;color:var(--text-muted)'},'完成 '+done+'/'+total+'（'+pct+'%）'));
section.appendChild(body);area.appendChild(section)})}

function emptyState(icon,text){return el('div',{class:'empty-state'},el('div',{class:'empty-icon'},icon),el('div',{class:'empty-state-text'},text))}

// ============ Summary ============
$('#showAllStudents').addEventListener('change',renderSummary);
function computeMissing(b,students){const cols=getFullColumns(b);return students.map(s=>{const missing=cols.filter(c=>getStatus(b.id,c.key,s.id)==='empty');const partial=cols.filter(c=>getStatus(b.id,c.key,s.id)==='partial');return{student:s,missing,partial}}).sort((a,c)=>(c.missing.length+c.partial.length)-(a.missing.length+a.partial.length))}
function severityClass(c){return c===0?'severity-low':c<=2?'severity-mid':'severity-high'}
function renderSummary(){const area=$('#summaryArea');area.innerHTML='';const cls=getActiveClass();
if(!cls){area.appendChild(emptyState('🏫','請先新增班級'));return}
if(!cls.students.length){area.appendChild(emptyState('👥','班級尚無學生'));return}
const showAll=$('#showAllStudents').checked;const books=getBooksForActiveClass();
if(!books.length){area.appendChild(emptyState('📚','尚無教材'));return}
[{type:'homework',title:'📖 功課未完成',ok:'全部完成！🎉'},{type:'recitation',title:'🎤 背誦未完成',ok:'全部完成！🎉'}].forEach(sec=>{const sb=books.filter(b=>b.type===sec.type);if(!sb.length)return;
const card=el('div',{class:'card'});card.appendChild(el('h3',{style:'font-size:15px;font-weight:600;margin:0 0 8px'},sec.title));
sb.forEach(b=>{ensureBookDefaults(b);const cols=getFullColumns(b);const rows=computeMissing(b,cls.students);const filtered=showAll?rows:rows.filter(r=>r.missing.length>0||r.partial.length>0);
const isHw=b.type==='homework';
card.appendChild(el('div',{style:'font-size:14px;font-weight:600;margin:12px 0 6px'},b.name,el('span',{class:'list-item-meta',style:'margin-left:8px;font-weight:normal'},cols.length+'欄')));
if(!filtered.length){card.appendChild(el('div',{class:'summary-empty'},sec.ok));return}
const headRow=el('tr',{},el('th',{},'姓名'),el('th',{},'未完成課次'));
if(isHw)headRow.appendChild(el('th',{},'未訂正課次'));
headRow.appendChild(el('th',{class:'col-count'},'未完成'));
if(isHw)headRow.appendChild(el('th',{class:'col-count'},'未訂正'));
const table=el('table',{class:'summary-table'});table.appendChild(el('thead',{},headRow));
const tbody=el('tbody');filtered.forEach(r=>{const total=r.missing.length+r.partial.length;const sev=severityClass(total);const sLabel=(r.student.engName?r.student.engName+' ':'')+r.student.name;const tr=el('tr',{},el('td',{},sLabel),el('td',{style:'font-size:12px'},r.missing.length===0?'—':r.missing.map(c=>c.type==='review'?c.label:fmtLessonFull(b,c.num)).join('、')));
if(isHw)tr.appendChild(el('td',{style:'font-size:12px;color:var(--warning)'},r.partial.length===0?'—':r.partial.map(c=>c.type==='review'?c.label:fmtLessonFull(b,c.num)).join('、')));
tr.appendChild(el('td',{class:'col-count '+sev},String(r.missing.length)));
if(isHw)tr.appendChild(el('td',{class:'col-count severity-mid'},String(r.partial.length)));
tbody.appendChild(tr)});
table.appendChild(tbody);card.appendChild(table)});area.appendChild(card)})}

// ============ Export ============
function renderPdfBookSelector(){const cont=$('#pdfBookSelector');cont.innerHTML='';const books=getBooksForActiveClass();
if(!books.length){cont.appendChild(el('div',{style:'font-size:13px;color:var(--text-muted)'},'尚無教材'));return}
books.forEach(b=>{ensureBookDefaults(b);const cols=getFullColumns(b);cont.appendChild(el('label',{style:'display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--border-color);cursor:pointer'},el('input',{type:'checkbox',checked:'checked',class:'pdf-book-cb',dataset:{bookId:b.id},style:'width:auto;flex-shrink:0'}),el('span',{class:'badge '+(b.type==='recitation'?'badge-recitation':'')},b.type==='recitation'?'背誦':'功課'),el('span',{},b.name),el('span',{style:'font-size:11px;color:var(--text-muted);margin-left:auto'},cols.length+'欄')))})}
$('#pdfSelectAll').addEventListener('click',()=>$$('.pdf-book-cb').forEach(c=>c.checked=true));
$('#pdfSelectNone').addEventListener('click',()=>$$('.pdf-book-cb').forEach(c=>c.checked=false));
function getSelectedPdfBookIds(){return[...$$('.pdf-book-cb')].filter(c=>c.checked).map(c=>c.dataset.bookId)}

function buildPdfContent(ids){const area=$('#pdfRenderArea');area.innerHTML='';const cls=getActiveClass();if(!cls)return false;
const books=getBooksForActiveClass().filter(b=>ids.includes(b.id));if(!books.length)return false;
const ds=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'});
area.appendChild(el('h1',{},cls.name+' 功課背誦進度表'));area.appendChild(el('div',{class:'pdf-meta'},'列印日期：'+ds+'　|　學生人數：'+cls.students.length));
['homework','recitation'].forEach(type=>{const tb=books.filter(b=>b.type===type);if(!tb.length)return;
area.appendChild(el('h2',{},type==='homework'?'📖 功課':'🎤 背誦'));
tb.forEach(b=>{ensureBookDefaults(b);const cols=getFullColumns(b);const info=bookInfoText(b);
area.appendChild(el('div',{style:'font-size:13px;font-weight:700;margin:10px 0 4px'},b.name+'（'+info+'）'));
if(!cols.length){area.appendChild(el('p',{style:'font-size:12px;color:#888'},'目前無需完成'));return}
const pdfIsHw=b.type==='homework';
const table=el('table');const headRow=el('tr',{},el('th',{style:'width:80px;text-align:left'},'姓名'));
cols.forEach(c=>headRow.appendChild(el('th',{},c.type==='review'?c.label:fmtLesson(b,c.num))));
headRow.appendChild(el('th',{style:'width:50px'},'未完成'));
if(pdfIsHw)headRow.appendChild(el('th',{style:'width:50px'},'未訂正'));
table.appendChild(el('thead',{},headRow));
const tbody=el('tbody');cls.students.forEach(s=>{let miss=0,part=0;const pdfName=(s.engName?s.engName+' ':'')+s.name;const row=el('tr',{},el('td',{class:'name'},pdfName));
cols.forEach(c=>{const st=getStatus(b.id,c.key,s.id);if(st==='done')row.appendChild(el('td',{class:'pdf-check'},'✓'));else if(st==='partial'){part++;row.appendChild(el('td',{class:'pdf-partial'},'△'))}else{miss++;row.appendChild(el('td',{class:'pdf-miss'},''))}});
row.appendChild(el('td',{class:miss>0?'pdf-miss':'',style:'font-weight:700'},String(miss)));
if(pdfIsHw)row.appendChild(el('td',{class:part>0?'pdf-partial':'',style:'font-weight:700'},String(part)));
tbody.appendChild(row)});
table.appendChild(tbody);area.appendChild(table)})});return true}

async function exportPdf(){const cls=getActiveClass();if(!cls)return showToast('請先選擇班級');if(!cls.students.length)return showToast('班級尚無學生');
const ids=getSelectedPdfBookIds();if(!ids.length)return showToast('請至少勾選一項教材');
showToast('PDF 產生中...',5000);if(!buildPdfContent(ids))return;await new Promise(r=>setTimeout(r,100));
try{const canvas=await html2canvas($('#pdfRenderArea'),{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
const{jsPDF}=window.jspdf;const pdf=new jsPDF('l','mm','a4');const W=297,H=210,imgH=canvas.height*W/canvas.width;
if(imgH<=H){pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,W,imgH)}else{const ppx=canvas.width*H/W;let y=0,pg=0;while(y<canvas.height){const sh=Math.min(ppx,canvas.height-y);const sl=document.createElement('canvas');sl.width=canvas.width;sl.height=sh;sl.getContext('2d').drawImage(canvas,0,y,canvas.width,sh,0,0,canvas.width,sh);if(pg>0)pdf.addPage();pdf.addImage(sl.toDataURL('image/png'),'PNG',0,0,W,sh*W/canvas.width);y+=sh;pg++}}
pdf.save(cls.name+'_進度表_'+new Date().toISOString().slice(0,10)+'.pdf');showToast('PDF 已產生')}catch(e){console.error(e);showToast('PDF 失敗：'+e.message,4000)}finally{$('#pdfRenderArea').innerHTML=''}}
$('#exportPdfBtn').addEventListener('click',exportPdf);

// JSON
$('#exportJsonBtn').addEventListener('click',()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='homework_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);showToast('已匯出')});
$('#importJsonBtn').addEventListener('click',()=>$('#importJsonFile').click());
$('#importJsonFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const ok=await confirmDialog('匯入','匯入將覆蓋所有資料，確定？');e.target.value='';if(!ok)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.classes))throw new Error('格式不正確');state=Object.assign(defaultState(),d);saveState();applyTheme();renderAll();showToast('已匯入')}catch(err){showToast('失敗：'+err.message,4000)}});
$('#resetAllBtn').addEventListener('click',async()=>{const ok=await confirmDialog('清除所有資料','無法復原，確定？');if(!ok)return;state=defaultState();saveState();applyTheme();renderAll();showToast('已清除')});

// Init
applyTheme();renderAll();switchTab('today')
</script>
